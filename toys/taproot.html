<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Taproot</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #16141a;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
  #hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 1.2rem 1.5rem;
    font-family: Georgia, 'Times New Roman', serif;
    color: #cbb8d8;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  #hud h1 {
    margin: 0 0 0.2rem 0;
    font-size: 1.3rem;
    font-weight: normal;
    letter-spacing: 0.02em;
  }
  #hud p {
    margin: 0;
    font-size: 0.85rem;
    opacity: 0.65;
    max-width: 34em;
  }
  #reset {
    position: fixed;
    bottom: 1rem;
    right: 1.2rem;
    font-family: Georgia, serif;
    font-size: 0.75rem;
    color: #7a6f85;
    text-decoration: none;
    border-bottom: 1px dotted #55495c;
  }
  #reset:hover {
    color: #cbb8d8;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <h1>Taproot</h1>
  <p id="hud-text">a rosette, first year.</p>
</div>
<a href="#" id="reset">forget this one and start over</a>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var hudText = document.getElementById('hud-text');
  var resetLink = document.getElementById('reset');
  var STORE_KEY = 'thistle-taproot-visits';

  var storageOK = true;
  var visits = 1;
  try {
    var stored = window.localStorage.getItem(STORE_KEY);
    visits = stored ? parseInt(stored, 10) + 1 : 1;
    window.localStorage.setItem(STORE_KEY, String(visits));
  } catch (e) {
    storageOK = false;
    visits = 1;
  }

  // capped growth stage — the plant matures over ~10 visits and then holds
  var stage = Math.min(visits - 1, 10);

  // deterministic per-stage RNG: same stage always draws the same plant,
  // so it only changes by coming back, not by chance
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(Math.imul(stage + 1, 2654435761) >>> 0);
  function r(a, b) { return a + rand() * (b - a); }

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', function () { resize(); draw(); });

  function leafSpike(x, y, angle, len, hue) {
    var x2 = x + Math.sin(angle) * len;
    var y2 = y - Math.cos(angle) * len;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x2, y2);
    ctx.lineWidth = r(1.2, 2.2);
    ctx.strokeStyle = 'hsl(' + hue + ', 26%, ' + r(20, 30) + '%)';
    ctx.lineCap = 'round';
    ctx.stroke();
    return [x2, y2];
  }

  function rosette(x, y, size) {
    var n = Math.floor(r(9, 13));
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2 + r(-0.1, 0.1);
      var len = size * r(0.6, 1);
      var tip = leafSpike(x, y, a, len, r(95, 125));
      // small barb near the tip
      var barbA = a + r(-0.6, 0.6);
      leafSpike(tip[0], tip[1], barbA, len * 0.3, r(95, 125));
    }
  }

  function branch(x, y, len, angle, width, depth, maxDepth) {
    var x2 = x + Math.sin(angle) * len;
    var y2 = y - Math.cos(angle) * len;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x2, y2);
    ctx.lineWidth = width;
    ctx.strokeStyle = 'hsl(' + r(95, 130) + ', 28%, ' + (18 + (maxDepth - depth) * 3) + '%)';
    ctx.lineCap = 'round';
    ctx.stroke();

    if (depth > 1 && rand() < 0.5) {
      var t = r(0.3, 0.7);
      var lx = x + (x2 - x) * t;
      var ly = y + (y2 - y) * t;
      [-1, 1].forEach(function (side) {
        leafSpike(lx, ly, angle + side * r(0.9, 1.4), len * r(0.25, 0.4), 105);
      });
    }

    if (depth <= 0) {
      if (stage >= 2) flower(x2, y2, angle);
      return;
    }

    var children = rand() < 0.3 ? 2 : 1;
    for (var i = 0; i < children; i++) {
      var spread = children === 2 ? (i === 0 ? -1 : 1) * r(0.15, 0.32) : r(-0.1, 0.1);
      branch(x2, y2, len * r(0.68, 0.82), angle + spread, Math.max(0.6, width * 0.72), depth - 1, maxDepth);
    }
  }

  function flower(x, y, angle) {
    ctx.beginPath();
    ctx.ellipse(x, y, 6, 8, angle, 0, Math.PI * 2);
    ctx.fillStyle = 'hsl(100, 30%, 24%)';
    ctx.fill();
    var spikes = Math.floor(r(14, 22));
    for (var i = 0; i < spikes; i++) {
      var a = angle + (i / spikes) * Math.PI * 2 + r(-0.15, 0.15);
      var len = r(9, 16);
      var x2 = x + Math.sin(a) * len;
      var y2 = y - Math.cos(a) * len;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x2, y2);
      ctx.lineWidth = r(1, 1.8);
      ctx.strokeStyle = 'hsl(' + r(275, 300) + ', ' + r(45, 65) + '%, ' + r(45, 65) + '%)';
      ctx.stroke();
    }
  }

  function root(x, y, len, angle, width, depth) {
    var x2 = x + Math.sin(angle) * len;
    var y2 = y + Math.cos(angle) * len; // downward
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x2, y2);
    ctx.lineWidth = width;
    ctx.strokeStyle = 'hsl(30, 22%, ' + r(16, 24) + '%)';
    ctx.lineCap = 'round';
    ctx.stroke();
    if (depth <= 0) return;
    var children = rand() < 0.4 ? 2 : 1;
    for (var i = 0; i < children; i++) {
      var spread = children === 2 ? (i === 0 ? -1 : 1) * r(0.2, 0.45) : r(-0.15, 0.15);
      root(x2, y2, len * r(0.6, 0.8), angle + spread, Math.max(0.5, width * 0.7), depth - 1);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var baseX = canvas.width / 2;
    var groundY = canvas.height * 0.7;

    // ground line
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(canvas.width, groundY);
    ctx.strokeStyle = 'rgba(203, 184, 216, 0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // taproot, deeper with every visit
    var rootDepth = 1 + Math.floor(stage / 2);
    var rootLen = Math.min(canvas.height - groundY - 20, 40 + stage * 22);
    root(baseX, groundY, rootLen, r(-0.04, 0.04), 4, rootDepth);

    if (stage === 0) {
      rosette(baseX, groundY, r(28, 38));
    } else {
      var maxDepth = 3 + Math.floor(stage / 1.4);
      var stemLen = r(50, 65) + stage * 9;

      // a branching stem's total height is roughly stemLen times this
      // series (each level ~0.75x the last, summed over maxDepth levels);
      // cap stemLen so a tall, deep plant can't grow past the top of a
      // short window
      var seriesSum = 4 * (1 - Math.pow(0.75, maxDepth));
      var availableAbove = groundY - 90;
      if (stemLen * seriesSum > availableAbove) {
        stemLen = availableAbove / seriesSum;
      }

      rosette(baseX, groundY, r(14, 20)); // low leaves persist at the base
      branch(baseX, groundY, stemLen, r(-0.06, 0.06), 4 + stage * 0.3, maxDepth, maxDepth);
    }
  }

  function updateHud() {
    var visitWord = visits === 1 ? '1st visit' : visits + (visits === 2 ? 'nd' : visits === 3 ? 'rd' : 'th') + ' visit';
    var stageText;
    if (stage === 0) stageText = 'a rosette, first year — no stem yet.';
    else if (stage < 2) stageText = 'a stem now. no flowers yet.';
    else if (stage < 10) stageText = 'in bloom, ' + stage + '/10 grown.';
    else stageText = 'fully grown — this is as deep as this one goes.';

    var note = storageOK
      ? 'this plant only changes when you come back — nothing is sent anywhere, it stays in this browser.'
      : 'this browser won’t let it remember — every visit will look like the first.';

    hudText.textContent = visitWord + '. ' + stageText + ' ' + note;
  }

  resetLink.addEventListener('click', function (e) {
    e.preventDefault();
    try { window.localStorage.removeItem(STORE_KEY); } catch (e2) {}
    window.location.reload();
  });

  resize();
  draw();
  updateHud();
})();
</script>
</body>
</html>
